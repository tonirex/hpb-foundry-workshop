# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# LiveWell Coach — Microsoft Foundry workshop. One template, two azd environments (mcaps, sponsor).
#   azd env new mcaps   → scripts/preflight.sh → scripts/provision.sh (wraps azd provision)
# Per-env parameters: infra/env/<AZURE_ENV_NAME>.bicepparam, copied to infra/main.bicepparam by the
# preprovision hook (scripts/select-params.py). See content/admin/ADMIN-SETUP.md.
name: livewell-foundry-workshop
metadata:
  template: livewell-foundry-workshop@0.2.0

requiredVersions:
  azd: ">= 1.34.0"
  extensions:
    azure.ai.agents: ">= 1.0.0-beta.9"

infra:
  provider: bicep
  path: infra
  module: main

hooks:
  preprovision:
    posix:
      shell: sh
      run: python3 scripts/select-params.py --hook
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: python scripts/select-params.py --hook
      interactive: false
      continueOnError: false
  # Lab 2 blocklist items (not in Bicep: single-item GET returns 400 and breaks what-if), then the values
  # sheet (content/config/values.md) is regenerated from the new outputs.
  postprovision:
    posix:
      shell: sh
      run: python3 scripts/apply-guardrail.py && python3 scripts/render-values.py
      interactive: false
      continueOnError: false
    windows:
      shell: pwsh
      run: python scripts/apply-guardrail.py; if ($LASTEXITCODE -eq 0) { python scripts/render-values.py }; exit $LASTEXITCODE
      interactive: false
      continueOnError: false
  # Refresh the values sheet after every `azd deploy` (MCP URL, profile spec URL, hosted agent name).
  postdeploy:
    posix:
      shell: sh
      run: python3 scripts/render-values.py
      interactive: false
      continueOnError: true
    windows:
      shell: pwsh
      run: python scripts/render-values.py
      interactive: false
      continueOnError: true

services:
  # Lab 3 — activities MCP server (FastMCP, streamable HTTP at /mcp) + the Navigator profile OpenAPI
  # (/openapi.json, session resident only) on Azure Container Apps. Bicep creates the app (placeholder
  # image until the first deploy; afterwards SERVICE_MCP_ACTIVITIES_IMAGE_NAME keeps the deployed image).
  mcp-activities:
    project: content/assets/mcp-activities
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    # Single source of truth is content/data/*.json; copy them into the build context (git-ignored).
    hooks:
      prepackage:
        posix:
          shell: sh
          run: cp ../../data/activities.json ../../data/citizens.json ./
        windows:
          shell: pwsh
          run: Copy-Item ../../data/activities.json, ../../data/citizens.json ./ -Force

  # Lab 4 — DevUI in a browser (optional, LAB4_DEVUI): demos/lab4-devui.py with the sequential and hand-off
  # workflows on Azure Container Apps, with private expiring launch links and server-only bearer auth.
  # DevUI developer mode keeps Events/Traces/Tools; participant deploy/reload endpoints are blocked.
  # Participants need no local Python or token entry. Bicep creates the app; the prepackage hook
  # stages the script and the content files it reads into demos/devui-aca/app (git-ignored).
  lab4-devui:
    project: demos/devui-aca
    host: containerapp
    language: python
    docker:
      path: Dockerfile
      remoteBuild: true
    hooks:
      prepackage:
        posix:
          shell: sh
          run: python3 ../../scripts/stage-devui.py
        windows:
          shell: pwsh
          run: python ../../scripts/stage-devui.py

  # Lab 4 — facilitator-only hosted agent: the Lab 4 sequential team (Agent Framework) behind a Responses
  # endpoint. Code deploy (no Docker): `azd deploy livewell-workshop-hosted`; see
  # content/assets/hosted-agent-example/README.md. The service key must equal `name` (azd postdeploy looks
  # the agent up by the key). The extension targets AZURE_AI_PROJECT_ID / AZURE_AI_PROJECT_ENDPOINT (Bicep).
  livewell-workshop-hosted:
    project: content/assets/hosted-agent-example
    host: azure.ai.agent
    language: python
    kind: hosted
    name: livewell-workshop-hosted
    displayName: LiveWell Coach (hosted)
    description: LiveWell Coach team (Nutrition, Activity, Coach) as a hosted agent, facilitator demo in Lab 4.
    metadata:
      tags:
        - LiveWell
        - Agent Framework
        - Hosted Agent
        - Responses Protocol
        - Lab 4
    protocols:
      - protocol: responses
        version: 2.0.0
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    # Postdeploy hook (scripts/hosted-postdeploy.py), run with the repo .venv active:
    # * grants the agent identity (created on first deploy) Foundry User on the project, which it needs to
    #   call the models and read the tool connections;
    # * attaches livewell-guardrails. The extension does not expand ${VAR} in `policies` for hosted agents
    #   and a literal ID would tie this file to one tenant, so the hook publishes a new version with
    #   rai_config = the full resource ID of livewell-guardrails.
    hooks:
      postdeploy:
        posix:
          shell: sh
          run: python3 ../../../scripts/hosted-postdeploy.py
          interactive: false
          continueOnError: false
        windows:
          shell: pwsh
          run: python ../../../scripts/hosted-postdeploy.py
          interactive: false
          continueOnError: false
