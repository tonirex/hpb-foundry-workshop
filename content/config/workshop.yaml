# content/config/workshop.yaml
# LiveWell Coach — Microsoft Foundry workshop for the Health Promotion Board (Singapore).
#
# This is the ONE config file allowed to hold environment identifiers (subscription / tenant IDs).
# Lab pages, slides and script constants use NAMES only; runtime values (endpoints, IDs) live in
# .azure/<env>/.env and are rendered into content/config/values.md by scripts/render-values.py.
# Values marked TODO are listed in ASSUMPTIONS.md under "Values Antonia must supply".

workshop:
  name: "LiveWell Coach — Microsoft Foundry Workshop"
  short_name: "livewell"
  customer: "Health Promotion Board (Singapore)"
  owner: "Antonia Chen (Sr Solution Engineer, Microsoft Singapore)"
  # PRIVATE copy for this delivery: lab instructions, printed on the sign-in cards. An Azure/TAP identity does NOT grant
  # GitHub access: Builder participants need a collaborator invite or the release ZIP (content/admin/HPB-DELIVERY-RUNBOOK.md).
  repo_url: "https://github.com/tonirex/hpb-foundry-workshop"
  date: "TODO"                     # workshop day (YYYY-MM-DD)
  # Headcount is per environment: environments.<env>.participants (mcaps 30, sponsor 6). Quota sizing, the lab account
  # count and the sign-in cards all derive from it (tests/test_config.py keeps them in agreement).
  guest_wifi:
    ssid: "TODO"
    code: "TODO"
  logistics:
    personal_laptops_required: true   # WOG devices cannot sign in to external Entra tenants
    # Per environment: environments.<env>.lab_accounts.sign_in. mcaps = Temporary Access Pass (no Authenticator registration);
    # the sponsor tenant still uses a temporary password plus Authenticator.
    authenticator_registration_at_first_sign_in: false

  rails: [navigator, builder]
  default_rail: navigator
  devui_access:
    link_lifetime_hours: 10         # starts when the facilitator renders the private values sheet; maximum 12
  agent_naming:
    portal_agent: "livewell-<initials>"             # Lab 0 portal agent, reused by Navigator labs
    builder_agent: "livewell-<INITIALS>-<role>"     # created by content/assets/labN_*.py
    demo_prefix: "livewell-demo-"                   # facilitator demo agents — never deleted by scripts
    protected_prefixes: ["livewell-demo-", "livewell-workshop-"]
    demo_agents:                                    # created by demos/ (Phase 5); referenced in the run of show
      lab0: "livewell-demo-lab0"
      knowledge: "livewell-demo-kb"
      guarded: "livewell-demo-guarded"
      tools: "livewell-demo-tools"
      fabric: "livewell-demo-fabric"
      nutrition: "livewell-demo-nutrition"          # Lab 3 specialists, reachable over A2A (Navigator step 11)
      activity: "livewell-demo-activity"

# ---------------------------------------------------------------------------
# Names shared by both azd environments (SPEC.md §8.3). <env> = mcaps | sponsor.
# ---------------------------------------------------------------------------
names:
  location: "swedencentral"               # every resource except Search; its approved per-environment location is below
                                          # no automatic fallback (ASSUMPTIONS.md 11.13); never Southeast Asia
  resource_group: "rg-livewell-workshop-<env>"   # the ONE resource group: set here once, exported as AZURE_RESOURCE_GROUP, used by every script
  # The next two are GLOBAL DNS names (<name>.cognitiveservices.azure.com / <name>.search.windows.net): unique across
  # all of Azure, not just this subscription. The bare "aif-livewell-<env>" / "srch-livewell-<env>" were already taken
  # (checked 2026-10-23, most likely the earlier workshop's environment in another subscription), hence "hpb". Preflight
  # check 7 re-checks availability; never reuse a name that preflight reports as someone else's.
  foundry_account: "aif-hpb-livewell-<env>"
  foundry_project: "livewell-workshop"
  search_service: "srch-hpb-livewell-<env>"
  fabric_capacity: "fabhpblivewell<env>"   # original name was occupied; availability checked 2026-10-24
  fabric_workspace: "HPB Resident 360"
  lakehouse: "lh_resident360"
  ontology: "resident_ontology"
  data_agent: "Resident360 Ontology Agent"
  knowledge_base: "livewell-guides-kb"
  knowledge_source: "livewell-guides-ks"
  knowledge_container: "livewell-guides"
  search_connection: "livewell-search"             # project connection to the shared search service (Foundry IQ)
  storage_connection: "livewell-storage"           # project connection to the knowledge blob account
  acr_connection: "livewell-acr"                   # project connection to ACR (hosted agent images)
  appinsights_connection: "livewell-appinsights"   # project connection to Application Insights (tracing)
  mcp_app: "ca-mcp-activities-<env>"
  devui_app: "ca-lab4-devui-<env>"                 # Lab 4 DevUI in a browser (LAB4_DEVUI, azd deploy lab4-devui)
  mcp_connection: "livewell-activities-mcp"        # project connection to the activities MCP server
  profile_openapi_tool: "livewell_profile"         # Navigator OpenAPI tool over the profile endpoint
  fabric_connection: "livewell-fabric-resident360" # project connection created by Add tool -> Fabric IQ
  kb_mcp_connection: "livewell-guides-kb-mcp"      # project connection to the knowledge base MCP endpoint
  nutrition_a2a_connection: "livewell-nutrition-a2a"  # A2A connection to livewell-demo-nutrition (Lab 3 step 11)
  activity_a2a_connection: "livewell-activity-a2a"    # A2A connection to livewell-demo-activity (Lab 3 step 11)
  hosted_agent: "livewell-workshop-hosted"         # Lab 4 facilitator hosted agent (protected prefix)
  rai_policy: "livewell-guardrails"
  medication_blocklist: "livewell-medication-dosage"
  budget: "budget-livewell-<env>"

models:
  # Chosen from read-only discovery against the HPB MCAPS subscription, region swedencentral (inventory 2026-10-23;
  # ASSUMPTIONS.md 11.1, table in content/admin/HPB-DELIVERY-RUNBOOK.md). A catalogue entry is NOT proof of subscription
  # eligibility, free quota or deployable capacity: scripts/preflight.sh (scripts/lib/modelcheck.py) reports the four
  # separately and must be re-run at T-3. Live compatibility and load tests are still pending approval.
  # Two chat models plus embeddings; no model-router (decision 3), no quota requests are ever made automatically.
  default: "gpt-5-mini"              # Labs 0-2 agents, Lab 3 specialists, memory store, KB planner, Lab 4
  reasoning_effort:                  # per-deployment default for agents; gpt-5-mini's own default is medium
    gpt-5-mini: "low"                # low: about half the latency of medium and still calls every tool
  tools: "gpt-4.1-mini"              # Lab 3 coach on: OpenAPI, A2A and Fabric Data Agent tools are not supported on
                                     # gpt-5-mini (Learn tool-support table). Also the facilitator pre-run judge.
                                     # Catalogue lifecycle is Legacy (retires 2027-04-14), so a NEW deployment may be refused
                                     # in another subscription; here an existing deployment is the eligibility evidence.
  embeddings: "text-embedding-3-small"   # 1536 dimensions, unchanged: the index needs no re-build
  deployment_type: "GlobalStandard"  # GlobalStandard (pay per token) or DataZoneStandard; never a provisioned (PTU) type
  versions:                          # version per model name; every deployment is NoAutoUpgrade
    gpt-5-mini: "2025-08-07"
    gpt-4.1-mini: "2025-04-14"
    text-embedding-3-small: "1"
    gpt-5.4-mini: "2026-03-17"       # documented fallback for `default` (set default + deployment_type DataZoneStandard);
                                     # NOT deployed; needs a live compatibility test first (HPB-DELIVERY-RUNBOOK.md)
  units:                             # deployment capacity in 1K-TPM units per environment (1 unit = 1K TPM; the RPM per
                                     # unit comes from the catalogue rate limits, e.g. embeddings 6 RPM). Single source for
                                     # Bicep, preflight and cost-guardrails; the sum per quota pool must fit the free quota.
    mcaps:   { default: 800, tools: 1000, embeddings: 100 }   # 30 participants + facilitator demo, see sizing
    sponsor: { default: 400, tools: 200,  embeddings: 100 }   # 6 participants (ASSUMPTIONS.md 9.1)
  sizing:                            # planning ASSUMPTIONS, not measurements: replace after the approved load test
    participant_minute:              # tokens (K) and requests per participant per peak minute, by pool
      default:    { tokens_k: 18, requests: 6 }    # coach turn + specialists + memory + KB planning
      tools:      { tokens_k: 18, requests: 6 }    # Lab 3 coach with OpenAPI / A2A / Fabric tools
      embeddings: { tokens_k: 2,  requests: 3 }    # query embeddings for retrieval
    facilitator_demo:                # facilitator demo + pre-run evaluation, per peak minute
      default:    { tokens_k: 40, requests: 20 }
      tools:      { tokens_k: 40, requests: 20 }
      embeddings: { tokens_k: 5,  requests: 5 }
    burst_factor: 1.25               # headroom for bursty starts (everyone presses Run together)
  retirement_warn_days: 180          # preflight warns when a model retires within this many days after the workshop date
  forbidden: ["PTU", "model-router", "partner models (Anthropic, Mistral, Cohere)"]

# ---------------------------------------------------------------------------
# Region matrix (SPEC.md §8.2, service-level facts validated 25 Sep 2026 on an earlier subscription). scripts/preflight.sh
# FAILS if the configured service region is not "yes" on its row. Search alone has an approved France Central
# exception (ASSUMPTIONS.md 11.13). If capacity is unavailable, stop and report; never switch silently.
# These rows say nothing about THIS subscription's eligibility or quota: preflight checks those live.
# ---------------------------------------------------------------------------
region_matrix:
  validated_on: "2026-09-25"
  rows:
    foundry_project_agent_service:           { swedencentral: "yes" }
    gpt_5_mini_gpt_4_1_mini_global_standard: { swedencentral: "yes" }
    fabric_all_workloads_ontology_data_agent: { swedencentral: "yes" }
    search_agentic_retrieval_semantic_ranker: { swedencentral: "yes", francecentral: "yes" }
    evaluators_playground_batch_risk_safety:  { swedencentral: "yes" }
    hosted_agents:                           { swedencentral: "yes" }
  not_colocated:
    portal_red_teaming: "participants do not run red teaming. A facilitator pre-run needs separate approval and the cloud red team API (scripts/red-team-cloud.py, works in swedencentral, validated 2026-10-01; the portal wizard is documented for eastus2 / northcentralus only)"
  ruled_out:
    eastus2: "new Azure AI Search services capacity-blocked"
    southeastasia: "never used (SPEC.md §0)"
  capacity_notes:
    search:
      swedencentral: "2026-10-24: FetchOfferings returned no SKUs; Microsoft Learn flags new Search capacity constraints. Quota is not capacity."

