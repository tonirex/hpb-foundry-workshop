# What scripts/seed-attendees.sh grants each attendee (keys from rbac_roles; scope = resource).
attendee_roles:
  - { role: foundry_user, scope: project }               # agents, playground, evaluations in the shared project
  - { role: search_index_data_reader, scope: search }    # browse the shared knowledge base in the portal
  - { role: log_analytics_reader, scope: appinsights }   # Tracing tab (Lab 2)
  # Lab 2 is look-only now, so the judges no longer run as the attendee. Kept (model calls on this one account only) until a
  # rehearsal shows whether reading the prepared evaluation works without it: then drop it (ASSUMPTIONS.md 11.8).
  - { role: cognitive_services_openai_user, scope: account }

# Built-in Entra directory roles (template IDs, identical in every tenant). Used by
# scripts/tenant/create-lab-users.sh for the break-glass account only.
entra_roles:
  global_administrator: "62e90394-69f5-4237-9190-012177145e10"

modes:
  project_mode: "shared-project"     # shared-project | project-per-attendee
  fabric_bridge: true                # FABRIC_BRIDGE; false = profile tool reads citizens.json, Fabric step skipped

# ---------------------------------------------------------------------------
# Environments. IDs are allowed here (and only here) — see header comment.
# ---------------------------------------------------------------------------
environments:
  mcaps:
    purpose: "HPB workshop delivery (30 participants): one resource group, Sweden Central with Search in France Central"
    search_location: "francecentral"   # user-approved Search-only exception, 2026-10-24; not an automatic fallback
    storage_policy_opt_out_tag: { SecurityControl: "Ignore" }   # explicitly approved for workshop Blob ingestion
    subscription_id: "c4745a9c-2fb6-4336-a000-6e0f71afaeb5"
    tenant_id: "f41bde0b-74cd-498a-9091-079dec7418a4"
    participants: 30
    facilitator_upns:
      - "kychan@MngEnvMCAP261533.onmicrosoft.com"   # Fabric capacity admin + Foundry Project Manager (holds Owner on the subscription)
    lab_accounts:
      prefix: "hpb.lab"
      count: 30
      pattern: "hpb.lab01 … hpb.lab30"
      break_glass: "hpb.breakglass"   # created ONLY by `create-lab-users.sh --break-glass` (off by default: a standing Global Administrator)
      usage_location: "SG"
      sign_in: "tap"                  # tap = Temporary Access Pass, no passwords or Authenticator; password = temporary password + Authenticator
      tap:
        lifetime_minutes: 480         # one workshop day; Entra policy bounds are 10 minutes to 30 days
        one_time_use: false           # the portal, Fabric and `az login` each need a sign-in, so multi-use inside the lifetime
    # Planning ceiling for the workshop resource group, NOT an approved spend: Azure budgets only alert, they do not stop spend.
    budget_usd: 500
    budget_alerts_usd: [250, 500]
    budget_contacts: ["kychan@MngEnvMCAP261533.onmicrosoft.com"]   # confirm this is a mailbox that receives mail (ASSUMPTIONS.md 11.5)
  sponsor:
    # Reference environment from the earlier 6-person delivery; not used or re-validated by the HPB MCAPS delivery.
    purpose: "reference (earlier delivery)"
    search_location: "francecentral"   # preserves the earlier sponsor Search location; this environment is not redeployed
    storage_policy_opt_out_tag: {}
    subscription_id: "d865b78f-2913-4f0a-8945-ff436fe33f6b"   # HPB-workshop_HPB_Customer (Azure Sponsorship)
    tenant_id: "f42d5e19-57d1-4047-8d3d-cd4bb2fe7d9a"         # hpbsub2026outlook.onmicrosoft.com
    participants: 6
    facilitator_upns:
      # Cloud-only work account: a personal Microsoft account (hpb.sub2026@outlook.com, which created the tenant
      # and stays Global Administrator + Owner) cannot create a Fabric capacity (ASSUMPTIONS.md 10.1).
      - "hpb.facilitator@hpbsub2026outlook.onmicrosoft.com"
    lab_accounts:
      # Named participant accounts (firstname.lastname, listed in the gitignored attendees.txt; ASSUMPTIONS.md 10.8).
      # prefix/count/break_glass are only used by scripts/tenant/create-lab-users.sh.
      naming: "named"
      prefix: "hpb.lab"
      count: 20
      break_glass: "hpb.breakglass"
      usage_location: "SG"
      sign_in: "password"
    budget_usd: 300
    budget_alerts_usd: [150, 300]
    budget_contacts: ["hpb.sub2026@outlook.com"]

# ---------------------------------------------------------------------------
# Upstream kit (vendored under content/data/resident360/ with NOTICE.md).
# ---------------------------------------------------------------------------
upstream:
  resident360_kit:
    repo: "https://github.com/stellistic/resident-360-data-workshop"
    pinned_sha: "3ce11e429b8e306e9e2ff115e42b838dbf47b777"
    pinned_on: "2026-09-28"
    licence: "MIT"

labs:
  - id: lab-00
    title: "Setup & first agent"
    minutes: 15
    rails: [navigator]
    patterns: [10]
  - id: lab-01
    title: "Agents & Knowledge — Foundry IQ"
    minutes: 35
    rails: [navigator, builder]
    patterns: [1, 4]
  - id: lab-02
    title: "Guardrails, Evaluations & Tracing"
    minutes: 30
    rails: [navigator, builder]
    patterns: [5, 7, 10]
  - id: lab-03
    title: "Tools, MCP & Memory — hyper-personalisation"
    minutes: 30
    rails: [navigator, builder]
    patterns: [2, 3, 6, 8, 9]
    optional_step: fabric-step
  - id: lab-04
    title: "Multi-agent & Hosted deploy"
    minutes: 30
    rails: [navigator, builder]
    patterns: [3, 9, 10]
  - id: bridge-spotlight
    title: "Two IQs, one agent"
    minutes: 8
    facilitator_only: true
