# content/config/workshop.yaml
# LiveWell Coach — Microsoft Foundry workshop for the Health Promotion Board (Singapore).
#
# This is the ONE config file allowed to hold environment identifiers (subscription / tenant IDs).
# Lab pages, slides and script constants use NAMES only; runtime values (endpoints, IDs) live in
# .azure/<env>/.env and are rendered into content/config/values.md by scripts/render-values.py.
# Values marked TODO are listed in ASSUMPTIONS.md under "Values Antonia must supply".

workshop:
  name: "LiveWell Coach — Microsoft Foundry Workshop"
  short_name: "livewell"
  customer: "Health Promotion Board (Singapore)"
  owner: "Antonia Chen (Sr Solution Engineer, Microsoft Singapore)"
  repo_url: "https://github.com/tonirex/livewell-foundry-workshop"  # lab instructions, printed on the sign-in cards
  date: "TODO"                     # workshop day (YYYY-MM-DD)
  participant_count: 6              # confirmed HPB head-count; sponsor quota sized for it (ASSUMPTIONS.md 9.1)
  planning_cohort_size: 20
  guest_wifi:
    ssid: "TODO"
    code: "TODO"
  logistics:
    personal_laptops_required: true   # WOG devices cannot sign in to external Entra tenants
    authenticator_registration_at_first_sign_in: true

  rails: [navigator, builder]
  default_rail: navigator
  agent_naming:
    portal_agent: "livewell-<initials>"             # Lab 0 portal agent, reused by Navigator labs
    builder_agent: "livewell-<INITIALS>-<role>"     # created by content/assets/labN_*.py
    demo_prefix: "livewell-demo-"                   # facilitator demo agents — never deleted by scripts
    protected_prefixes: ["livewell-demo-", "livewell-workshop-"]
    demo_agents:                                    # created by demos/ (Phase 5); referenced in the run of show
      lab0: "livewell-demo-lab0"
      knowledge: "livewell-demo-kb"
      guarded: "livewell-demo-guarded"
      tools: "livewell-demo-tools"
      fabric: "livewell-demo-fabric"
      nutrition: "livewell-demo-nutrition"          # Lab 3 specialists, reachable over A2A (Navigator step 11)
      activity: "livewell-demo-activity"

# ---------------------------------------------------------------------------
# Names shared by both azd environments (SPEC.md §8.3). <env> = mcaps | sponsor.
# ---------------------------------------------------------------------------
names:
  location: "swedencentral"               # single region for EVERY resource (never Southeast Asia)
  fallback_location: "northcentralus"     # documented fallback only (SPEC.md §8.2)
  resource_group: "rg-livewell-workshop-<env>"
  foundry_account: "aif-livewell-<env>"
  foundry_project: "livewell-workshop"
  search_service: "srch-livewell-<env>"
  fabric_capacity: "fablivewell<env>"
  fabric_workspace: "HPB Resident 360"
  lakehouse: "lh_resident360"
  ontology: "resident_ontology"
  data_agent: "Resident360 Ontology Agent"
  knowledge_base: "livewell-guides-kb"
  knowledge_source: "livewell-guides-ks"
  knowledge_container: "livewell-guides"
  search_connection: "livewell-search"             # project connection to the shared search service (Foundry IQ)
  storage_connection: "livewell-storage"           # project connection to the knowledge blob account
  acr_connection: "livewell-acr"                   # project connection to ACR (hosted agent images)
  appinsights_connection: "livewell-appinsights"   # project connection to Application Insights (tracing)
  mcp_app: "ca-mcp-activities-<env>"
  devui_app: "ca-lab4-devui-<env>"                 # Lab 4 DevUI in a browser (LAB4_DEVUI, azd deploy lab4-devui)
  mcp_connection: "livewell-activities-mcp"        # project connection to the activities MCP server
  profile_openapi_tool: "livewell_profile"         # Navigator OpenAPI tool over the profile endpoint
  fabric_connection: "livewell-fabric-resident360" # project connection created by Add tool -> Fabric IQ
  kb_mcp_connection: "livewell-guides-kb-mcp"      # project connection to the knowledge base MCP endpoint
  nutrition_a2a_connection: "livewell-nutrition-a2a"  # A2A connection to livewell-demo-nutrition (Lab 3 step 11)
  activity_a2a_connection: "livewell-activity-a2a"    # A2A connection to livewell-demo-activity (Lab 3 step 11)
  hosted_agent: "livewell-workshop-hosted"         # Lab 4 facilitator hosted agent (protected prefix)
  rai_policy: "livewell-guardrails"
  medication_blocklist: "livewell-medication-dosage"
  budget: "budget-livewell-<env>"

models:
  # Quota Tier 0 (Azure Sponsorship, Oct 2026) offers gpt-5-mini 500K, gpt-4.1-mini 200K, o4-mini 100K and
  # text-embedding-3-small 1M TPM, and no model-router (ASSUMPTIONS.md 9.1). Two chat models:
  default: "gpt-5-mini"              # Labs 0-2 agents, Lab 3 specialists, memory store, KB planner, Lab 4
  reasoning_effort:                  # per-deployment default for agents; gpt-5-mini's own default is medium
    gpt-5-mini: "low"                # low: about half the latency of medium and still calls every tool
  tools: "gpt-4.1-mini"              # Lab 3 coach on: OpenAPI, A2A and Fabric Data Agent tools are not
                                     # supported on gpt-5-mini (the portal removes them). Also the eval judge.
  embeddings: "text-embedding-3-small"
  deployment_type: "GlobalStandard"
  tpm_cap_thousands: 400             # gpt-5-mini; ~6 people plus a facilitator demo peak (~240K TPM measured)
  tools_tpm_cap_thousands: 200       # gpt-4.1-mini; Lab 3 is ~10K tokens a turn, Lab 2 judges burst higher
  embedding_tpm_cap_thousands: 100
  forbidden: ["PTU", "partner models (Anthropic, Mistral, Cohere)"]
  quota_usage_names:   # az cognitiveservices usage list -> OpenAI.GlobalStandard.<name>
    gpt-5-mini: "gpt-5-mini"
    gpt-4.1-mini: "gpt4.1-mini"
    text-embedding-3-small: "text-embedding-3-small"

# ---------------------------------------------------------------------------
# Region matrix (SPEC.md §8.2, validated 25 Sep 2026). scripts/preflight.sh FAILS if the configured
# region is not "yes" on every row. "unverified" = documented fallback only: re-validate, then set
# PREFLIGHT_ACCEPT_FALLBACK=1 for that run.
# ---------------------------------------------------------------------------
region_matrix:
  validated_on: "2026-09-25"
  rows:
    foundry_project_agent_service:           { swedencentral: "yes", northcentralus: "unverified" }
    gpt_5_mini_gpt_4_1_mini_global_standard: { swedencentral: "yes", northcentralus: "unverified" }
    fabric_all_workloads_ontology_data_agent: { swedencentral: "yes", northcentralus: "unverified" }
    search_agentic_retrieval_semantic_ranker: { swedencentral: "yes", northcentralus: "unverified" }
    evaluators_playground_batch_risk_safety:  { swedencentral: "yes", northcentralus: "unverified" }
    hosted_agents:                           { swedencentral: "yes", northcentralus: "unverified" }
  not_colocated:
    portal_red_teaming: "portal wizard documented for eastus2 / northcentralus only -> run the cloud red team API (scripts/red-team-cloud.py, works in swedencentral, validated 2026-10-01; results show in the portal) or the azure-ai-evaluation SDK"
  ruled_out:
    eastus2: "new Azure AI Search services capacity-blocked"
    southeastasia: "never used (SPEC.md §0)"
  capacity_notes:   # live capacity blocks seen while provisioning (preflight check 7 reads these)
    search:
      swedencentral: "ResourcesForSkuUnavailable for new Basic AND serverless services on 2026-09-29 (mcaps first provision)"

# ---------------------------------------------------------------------------
# Built-in Azure role definitions (identical in every tenant). RBAC is assigned BY ID from here:
# infra/modules/rbac.bicep and scripts/seed-attendees.sh both read this block.
# ---------------------------------------------------------------------------
rbac_roles:
  foundry_user: "53ca6127-db72-4b80-b1b0-d745d6d5456d"              # attendees (project scope)
  foundry_project_manager: "eadc314b-1a2d-4efa-be10-5d325db5065e"   # facilitators (account scope)
  cognitive_services_user: "a97b65f3-24c7-4388-baec-2e87135dc908"   # search identity -> Foundry account
  search_index_data_reader: "1407120a-92aa-4202-b7e9-c0e197c71c8f"  # project identity -> search
  search_index_data_contributor: "8ebe5a00-799e-43f5-93ac-243d3dce84a7"
  search_service_contributor: "7ca78c08-252a-4471-8644-bb5ff32d4ba0"
  storage_blob_data_reader: "2a2b9908-6ea1-4ae2-8e65-a410df84e7d1"  # search identity -> storage
  storage_blob_data_contributor: "ba92f5b4-2d11-453d-a403-e96b0029c9fe"
  acr_pull: "7f951dda-4ed3-4680-a7ca-43fe172d538d"                  # project + MCP app identities
  acr_push: "8311e382-0749-4cb8-b61a-304f252e45ec"
  log_analytics_reader: "73c42c96-874c-492b-b04d-ab87d138a893"      # attendees -> Application Insights (portal traces)
  cognitive_services_openai_user: "5e0bd9bd-7b93-4f28-af87-19fc36ad61bd"  # attendees -> Foundry account (Lab 2 judges)
  foundry_agent_consumer: "eed3b665-ab3a-47b6-8f48-c9382fb1dad6"    # project identity -> project (A2A calls to the specialists)

# What scripts/seed-attendees.sh grants each attendee (keys from rbac_roles; scope = resource).
attendee_roles:
  - { role: foundry_user, scope: project }               # agents, playground, evaluations in the shared project
  - { role: search_index_data_reader, scope: search }    # browse the shared knowledge base in the portal
  - { role: log_analytics_reader, scope: appinsights }   # Tracing tab (Lab 2)
  - { role: cognitive_services_openai_user, scope: account }  # Lab 2 Builder judges call the account's OpenAI endpoint

# Built-in Entra directory roles (template IDs, identical in every tenant). Used by
# scripts/tenant/create-lab-users.sh for the break-glass account only.
entra_roles:
  global_administrator: "62e90394-69f5-4237-9190-012177145e10"

modes:
  project_mode: "shared-project"     # shared-project | project-per-attendee
  fabric_bridge: true                # FABRIC_BRIDGE; false = profile tool reads citizens.json, Fabric step skipped

# ---------------------------------------------------------------------------
# Environments. IDs are allowed here (and only here) — see header comment.
# ---------------------------------------------------------------------------
environments:
  mcaps:
    purpose: "dry run"
    subscription_id: "15715b5a-037a-4d59-bf60-2fa0986a3179"
    tenant_id: "108f6739-7d66-44bd-b535-c1812dab17b5"
    facilitator_upns:
      - "admin@mngenvmcap761802.onmicrosoft.com"   # Fabric capacity admin + Foundry Project Manager
    lab_accounts:
      prefix: "hpb.lab"
      count: 20
      pattern: "hpb.lab01 … hpb.lab20"
      break_glass: "hpb.breakglass"
      usage_location: "SG"
    budget_alerts_usd: [150, 300]
  sponsor:
    purpose: "delivery"
    subscription_id: "d865b78f-2913-4f0a-8945-ff436fe33f6b"   # HPB-workshop_HPB_Customer (Azure Sponsorship)
    tenant_id: "f42d5e19-57d1-4047-8d3d-cd4bb2fe7d9a"         # hpbsub2026outlook.onmicrosoft.com
    facilitator_upns:
      # Cloud-only work account: a personal Microsoft account (hpb.sub2026@outlook.com, which created the tenant
      # and stays Global Administrator + Owner) cannot create a Fabric capacity (ASSUMPTIONS.md 10.1).
      - "hpb.facilitator@hpbsub2026outlook.onmicrosoft.com"
    lab_accounts:
      # Named participant accounts (firstname.lastname, listed in the gitignored attendees.txt; ASSUMPTIONS.md 10.8).
      # prefix/count/break_glass are only used by scripts/tenant/create-lab-users.sh.
      naming: "named"
      prefix: "hpb.lab"
      count: 20
      break_glass: "hpb.breakglass"
      usage_location: "SG"
    budget_alerts_usd: [150, 300]

# ---------------------------------------------------------------------------
# Upstream kit (vendored under content/data/resident360/ with NOTICE.md).
# ---------------------------------------------------------------------------
upstream:
  resident360_kit:
    repo: "https://github.com/stellistic/resident-360-data-workshop"
    pinned_sha: "3ce11e429b8e306e9e2ff115e42b838dbf47b777"
    pinned_on: "2026-09-28"
    licence: "MIT"

labs:
  - id: lab-00
    title: "Setup & first agent"
    minutes: 15
    rails: [navigator]
    patterns: [10]
  - id: lab-01
    title: "Agents & Knowledge — Foundry IQ"
    minutes: 40
    rails: [navigator, builder]
    patterns: [1, 4]
  - id: lab-02
    title: "Guardrails, Evaluations & Tracing"
    minutes: 40
    rails: [navigator, builder]
    patterns: [5, 7, 10]
  - id: lab-03
    title: "Tools, MCP & Memory — hyper-personalisation"
    minutes: 40
    rails: [navigator, builder]
    patterns: [2, 3, 6, 8, 9]
    optional_step: fabric-step
  - id: lab-04
    title: "Multi-agent & Hosted deploy"
    minutes: 30
    rails: [builder]
    facilitator_only: true
    patterns: [3, 9, 10]
  - id: bridge-spotlight
    title: "Two IQs, one agent"
    minutes: 10
    facilitator_only: true
